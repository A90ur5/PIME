# Fork release workflow (adapted from upstream EasyIME/PIME ci.yaml).
# This fork has no SignPath code-signing token, so all SignPath signing
# steps are removed and the (unsigned) NSIS installer is published to the
# GitHub Release on tag pushes. `secrets` must not be referenced in any
# `if:` expression (GitHub's parser rejects that on this repository).

name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  # ---------------------------------------------------------------------
  # Build job – runs on every push/PR.
  # ---------------------------------------------------------------------
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'

      - name: Use Node.js 21.x
        uses: actions/setup-node@v6
        with:
          node-version: 21.x

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Run Rust tests
        run: |
          cd PIMELauncher
          cargo test --verbose

      - name: Use Install NSIS
        uses: repolevedavaj/install-nsis@v1.2.0
        with:
          nsis-version: 3.08

      - name: Run build.bat
        env:
          Rust_COMPILER: ${{ env.CARGO_HOME }}\\bin\\rustc.exe
        run: |
          .\\build.bat

      # ---------------------------------------------------------------------
      # Build the NSIS installer (unsigned).
      # ---------------------------------------------------------------------
      - name: Build the installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\NSIS\Bin\makensis.exe" ".\installer\installer.nsi"

      - name: Upload installer
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: installer/*.exe
          archive: false  # Do not zip the NSIS installer.

  # ---------------------------------------------------------------------
  # Release job – runs only for tag pushes.
  # ---------------------------------------------------------------------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer

      # ----- Create GitHub Release (tag only) -----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/PIME-*-setup.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
